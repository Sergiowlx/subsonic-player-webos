name: Build webOS IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download fork source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install project dependencies
        run: yarn install --frozen-lockfile

      - name: Install LG webOS packaging tools
        run: npm install --global @webos-tools/cli

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION="$(node -p "require('./webos/appinfo.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$APP_VERSION"

      - name: Build and package app
        run: bash webos/package-webos.sh

      - name: Verify that an IPK exists
        run: test -n "$(find . -maxdepth 2 -name '*.ipk' -print -quit)"

      - name: Upload IPK for download
        uses: actions/upload-artifact@v4
        with:
          name: subsonic-player-webos-ipk
          path: |
            ./*.ipk
            webos/*.ipk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Subsonic Player for webOS ${{ github.ref_name }}
          body: |
            ## TV interface and queue refinements

            - Refined TV navigation, library browsing, playback controls, and the Now Playing view.
            - Added queue scrolling and individual track removal, with larger current-track artwork and details.
            - Improved layout and scrolling compatibility with Chromium 79 on webOS 6.
            - Preserves the existing Subsonic/Navidrome playback and audio-quality settings.

            Download the IPK asset below and install it with webOS Dev Manager or the LG webOS CLI.
          files: |
            ./*.ipk
            com.subsonic.player.v2.manifest.json
          fail_on_unmatched_files: true
          make_latest: true
